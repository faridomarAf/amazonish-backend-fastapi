services:
  mysql:
    image: mysql:8.0
    container_name: amazonish-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "${DB_PORT}:3306"
    command: ["--default-authentication-plugin=mysql_native_password"]
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7
    container_name: amazonish-redis
    restart: always
    ports:
      - "${REDIS_PORT}:6379"

  api:
    build: .
    container_name: amazonish-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - mysql
      - redis

  worker:
    build: .
    container_name: amazonish-worker
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - mysql
      - redis

volumes:
  mysql_data: